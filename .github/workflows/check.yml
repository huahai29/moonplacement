name: MoonPlacement 检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装固定 MoonBit 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: 格式与检查
        run: |
          moon version --all
          moon version --all | grep -F "moonc v$(cat .moonbit-version)"
          moon fmt --check
          moon check --target all --deny-warn
      - name: 四后端测试
        run: |
          moon test --target js
          moon test --target wasm-gc
          moon test --target wasm
          moon test --target native
      - name: 构建与命令行测试
        run: |
          moon build --target js
          node --test tests/cli.test.mjs
      - name: 复核 KiCad 实际导出
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          node tests/kicad-export.mjs
      - name: 保存 KiCad 导出与核对报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-evidence
          path: _build/kicad-evidence
          if-no-files-found: ignore
