name: MoonPlacement 检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装固定 MoonBit 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: 格式与检查
        run: |
          moon version --all
          moon version --all | grep -F "moonc v$(cat .moonbit-version)"
          moon fmt --check
          moon check --target all --deny-warn
      - name: 四后端测试
        run: |
          moon test --target js
          moon test --target wasm-gc
          moon test --target wasm
          moon test --target native
      - name: 构建与命令行测试
        run: |
          moon build --target js
          node --test tests/cli.test.mjs
      - name: 验证归档可被独立项目使用
        run: |
          moon package --frozen
          mkdir -p _build/unpacked-release
          unzip -q _build/publish/huahai29-moonplacement-*.zip -d _build/unpacked-release
          module="$(find _build/unpacked-release -type f -name moon.mod -print -quit)"
          test -n "$module"
          node tests/release-consumer.mjs --unpacked "$(dirname "$module")"
      - name: 复核 KiCad 实际导出
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          node tests/kicad-export.mjs
      - name: 开源实板拼板验收
        run: node tests/kicad-panel.mjs
      - name: 独立 Gerber 铜层对照
        run: |
          python -m pip install pygerber==2.4.3
          python tests/gerber-oracle.py _build/kicad-evidence/copper
      - name: 保存 KiCad 导出与核对报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-evidence
          path: |
            _build/kicad-evidence
            _build/gerber-comparison
            _build/release-consumer/unpacked.json
            _build/real-panel
          if-no-files-found: ignore
