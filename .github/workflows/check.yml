name: MoonPlacement 检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装固定 MoonBit 工具链
        run: |
          version="$(tr -d '\r\n' < .moonbit-version)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            MOONBIT_INSTALL_VERSION="$version" pwsh -NoProfile -Command "irm https://cli.moonbitlang.com/install/powershell.ps1 | iex"
            echo "$USERPROFILE/.moon/bin" >> "$GITHUB_PATH"
          else
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
            bash /tmp/install-moonbit.sh "$version"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          fi
      - name: 格式与检查
        run: |
          moon version --all
          moon version --all | grep -F "moonc v$(tr -d '\r\n' < .moonbit-version)"
          moon fmt --check
          moon check --target all --deny-warn
      - name: JS 和 Wasm-GC 测试
        run: |
          moon test --target js
          moon test --target wasm-gc
      - name: Linux Wasm 与 Native 测试
        if: runner.os == 'Linux'
        run: |
          moon test --target wasm
          moon test --target native
      - name: 构建与命令行测试
        run: |
          moon build --target js
          node --test tests/cli.test.mjs
          node tests/demo-report.mjs
          node tests/report-contract.mjs
          python tests/pad-centroid-oracle.py
      - name: 记录 MoonBit 库覆盖率
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          moon coverage analyze --target-dir _build/coverage-ci -p huahai29/moonplacement -- --format full_summary | tee _build/coverage-summary.txt
          { echo '### MoonBit 库覆盖率'; echo; sed 's/^/    /' _build/coverage-summary.txt; } >> "$GITHUB_STEP_SUMMARY"
          node tests/check-coverage.mjs _build/coverage-summary.txt
      - name: 构建并验证浏览器工作台
        if: runner.os == 'Linux'
        run: |
          moon build --target js --release
          node web/build.mjs
          npm --prefix web ci
          npm --prefix web exec -- playwright install --with-deps chromium
          npm --prefix web test
      - name: 保存跨平台案例输出
        run: node tests/platform-cases.mjs record
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ runner.os }}
          path: _build/platform-cases.json
          if-no-files-found: error
      - name: 验证归档可被独立项目使用
        if: runner.os == 'Linux'
        run: |
          moon package --frozen
          mkdir -p _build/unpacked-release
          unzip -q _build/publish/huahai29-moonplacement-*.zip -d _build/unpacked-release
          module="$(find _build/unpacked-release -type f -name moon.mod -print -quit)"
          test -n "$module"
          node tests/release-consumer.mjs --unpacked "$(dirname "$module")"
      - name: 复核 KiCad 实际导出
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          node tests/kicad-export.mjs
      - name: 开源实板拼板验收
        if: runner.os == 'Linux'
        run: node tests/kicad-panel.mjs
      - name: 校验真实导出与拼板的文档数字
        if: runner.os == 'Linux'
        run: node tests/kicad-acceptance-doc.mjs
      - name: 记录拼板性能及核验结果
        if: runner.os == 'Linux'
        run: |
          MOONPLACEMENT_BENCH_SAMPLES=3 node tests/bench-panels.mjs
      - name: 独立 Gerber 铜层对照
        if: runner.os == 'Linux'
        run: |
          python -m pip install pygerber==2.4.3 jsonschema==4.26.0
          python tests/report-schema.py
          python tests/gerber-oracle.py _build/kicad-evidence/copper
      - name: 保存 KiCad 导出与核对报告
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: kicad-evidence
          path: |
            _build/kicad-evidence
            _build/gerber-comparison
            _build/release-consumer/unpacked.json
            _build/real-panel
            _build/panel-benchmark.json
            _build/coverage-summary.txt
            _build/pad-boundary/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _build/workbench

  compare-platforms:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: _build/platform-reports
      - name: 比对 Windows 与 Linux 的报告
        run: node tests/platform-cases.mjs compare _build/platform-reports/platform-Linux/platform-cases.json _build/platform-reports/platform-Windows/platform-cases.json

  deploy-workbench:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: compare-platforms
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: moonplacement-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
